name: Deploy The-ODC-Mf-UI Storybook to GitHub Pages
run-name: deploy-storybook (production) by @${{ github.actor }}

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. The Build and Verify Job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Production Optimization: Speeds up builds by caching ~/.bun/install/cache
      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Code Quality Gate: Prevents broken code formatting from making it to production
      - name: Lint and Format Verification
        run: |
          if bun pm bin | grep -q eslint; then bun run lint; else echo "No linter defined, skipping."; fi

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static
          retention-days: 1

  # 2. Production Summary Report
  report-build-status:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Generates a clear, visual markdown report directly inside your GitHub UI dashboard
      - name: Generate Production Summary Log
        run: |
          echo "### 🚀 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Application:** The-ODC-Mf-UI Storybook" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** \`${{ github.event_name }}\` on branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit ID:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # 3. Direct Production Deploy Job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
