name: Deploy The-ODC-Mf-UI Storybook to GitHub Pages
run-name: deploy-storybook (production) by @${{ github.actor }}

on:
  push:
    branches: [main]

# Grant explicit permissions required for direct GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent deployment conflicts from concurrent pushes
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

      - name: Deploy directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
